<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorijal 1, Zadatak 4</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
    <div id="okvir">
        <h1>Unos privatnih podataka</h1>

        <div class="napredak">
            <progress value="2" max="5">2 od 5</progress>
            <span>Korak 2 od 5</span>
        </div>

        <form>
            <div class="red-forme">
                <label for="datum-rodjenja">Datum rođenja:</label>
                <input type="date" id="datum-rodjenja" name="datum-rodjenja">
            </div>

            <div class="red-forme">
                <label for="email">Email adresa:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="dugmad">
                <button type="button">&lt;&lt; Nazad</button>
                <button type="submit">Dalje &gt;&gt;</button>
            </div>
        </form>
    </div>
</body>
</html>
